# docs/nginx/nak.gordulic.sk.conf — dokumentácia pre VPS, nie živý config.
# picus/infra/new-site.sh z tohto súboru prečíta client_max_body_size a proxy_read_timeout
# (prvý výskyt) a vygeneruje vhost aj s HTTPS sám. certbot --nginx nikdy nepoužívaj.
server {
    server_name nak.gordulic.sk;

    client_max_body_size 30m;     # upload účtov: PDF aj fotky z mobilu (appka sama odmietne > 25 MB)

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # login rate limiter dôveruje POSLEDNÉMU hopu X-Forwarded-For; nginx ho PREPISUJE skutočnou
        # adresou klienta (rovnako ako vhost z new-site.sh), takže podvrhnutá hlavička neprejde
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # extrakcia dokumentu cez Claude trvá aj 30–60 s
    }
}
