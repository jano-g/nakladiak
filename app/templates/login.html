<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191d" media="(prefers-color-scheme: dark)">
<title>Prihlásenie · {{ APP_NAME }}</title>
<link rel="stylesheet" href="/static/css/app.css?v={{ v }}">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
</head>
<body class="login-body">
<main class="login">
  <div class="login__brand">
    <img src="/static/img/icon-192.png" alt="" width="56" height="56">
    <h1>{{ APP_NAME }}</h1>
    <p class="muted">Čo stoja tvoje domácnosti</p>
  </div>
  <form method="post" action="/login" class="login__form" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<div class="alert alert--err" role="alert">{{ error }}</div>{% endif %}
    <label class="field">
      <span>Prihlasovacie meno</span>
      <input name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" autofocus required>
    </label>
    <label class="field">
      <span>Heslo</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn--primary btn--block" type="submit">Prihlásiť sa</button>
    {% if smtp %}<p class="login__forgot"><a href="/forgot">Zabudol som heslo</a></p>{% endif %}
  </form>
</main>
</body>
</html>
